[tox]
envlist =
    {py310,py311,py312,py313}-django{420}-sqlite
    py313-django{420}-{mysql,mariadb,postgres}
    flake8
    docs
    ; This is not that jslint :)
    jslint
    templatelint
    black
    doc8
    isort
    bandit
    mypy-django{420}

[testenv]
passenv = *
skip_install = True
deps =
    -r requirements-all.txt
    -r requirements-tests.txt
commands = python3 -m pytest {posargs:tests/}

[testenv:py313-django{420}-mysql]
description = Run tests with a real MySQL database instance. Start the container by running "make start-testdb-mysql".
allowlist_externals =
    bash
setenv =
    NITRATE_DB_ENGINE = mysql
    NITRATE_DB_HOST = 127.0.0.1
    NITRATE_DB_PORT = 33062
    NITRATE_DB_USER = root
    NITRATE_DB_PASSWORD = pass
commands_pre =
    bash {toxinidir}/contrib/scripts/adjust_mysql_auth_plugin.sh root pass

[testenv:py313-django{420}-mariadb]
description = Run tests with a real MariaDB database instance. Start the container by running "make start-testdb-mariadb".
setenv =
    NITRATE_DB_ENGINE = mysql
    NITRATE_DB_HOST = 127.0.0.1
    NITRATE_DB_PORT = 33061
    NITRATE_DB_USER = root
    NITRATE_DB_PASSWORD = pass

[testenv:py313-django{420}-postgres]
description = Run tests with a real PostgreSQL database instance. Start the container by running "make start-testdb-pgsql".
setenv =
    NITRATE_DB_ENGINE = pgsql
    NITRATE_DB_HOST = 127.0.0.1
    NITRATE_DB_PORT = 54321
    NITRATE_DB_USER = postgres
    NITRATE_DB_PASSWORD = pass
    NITRATE_DB_NAME = postgres

[testenv:flake8]
basepython = python3
skip_install = True
deps = flake8==7.3.0
commands = python3 -m flake8 {posargs:src/tcms tests}

[testenv:black]
basepython = python3
skip_install = True
deps = black==22.10.0
commands = python3 -m black {posargs:src/tcms tests}

[testenv:docs]
setenv =
    NITRATE_SECRET_KEY = key-for-testing-doc-build
basepython = python3
allowlist_externals = make
deps =
    -r requirements-all.txt
    -r requirements-docs.txt
changedir = {toxinidir}/docs
commands = make html

[testenv:jslint]
basepython = python3
skip_install = true
allowlist_externals =
    npm
    {toxinidir}/node_modules/.bin/eslint
commands_pre =
    npm install
commands =
    {toxinidir}/node_modules/.bin/eslint \
        src/static/js/nitrate.advanced-search.js \
        src/static/js/nitrate.attachments.js \
        src/static/js/nitrate.core.js \
        src/static/js/nitrate.footer.js \
        src/static/js/nitrate.index.js \
        src/static/js/nitrate.management.js \
        src/static/js/nitrate.profiles.js \
        src/static/js/nitrate.report.js \
        src/static/js/nitrate.testcases.js \
        src/static/js/nitrate.testplans.js \
        src/static/js/nitrate.testruns.js \
        tests/js/test-tcms-actions.js \
        tests/js/test-testplan-actions.js

[testenv:templatelint]
basepython = python3
skip_install = true
allowlist_externals = bash
commands = bash ./contrib/scripts/templatelint.sh src/templates/

[testenv:doc8]
basepython = python3
skip_install = true
deps = doc8==2.0.0
commands = python3 -m doc8 docs/source README.rst

[testenv:isort]
basepython = python3
skip_install = true
deps = isort==5.10.1
commands = python3 -m isort --check --diff {posargs:src/tcms tests}

[testenv:bandit]
basepython = python3
skip_install = true
deps = bandit==1.9.4
commands = python3 -m bandit -c pyproject.toml -r {posargs:src/tcms}

[testenv:mypy-django{420}]
deps =
     {[testenv]deps}
     -r requirements-devtools.txt
commands = python3 -m mypy {posargs:src/tcms/ tests/}

[flake8]
exclude =
    .tox,
    .git,
    .env,
    dist,
    build,
    src/tcms/settings/,
    *sqls.py,
    urls.py,
    wsgi.py,
    *settings.py,
    *raw_sql.py,
    *xml2dict*,
    ./docs/source/conf.py
ignore = E203,E501,W503,W504
max_line_length = 100
